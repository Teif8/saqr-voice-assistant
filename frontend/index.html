<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>
صقر | المساعد الصوتي السعودي
</title>

<link
href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Noto Naskh Arabic',serif;

background:#F8F4EC;

min-height:100vh;

overflow-x:hidden;

position:relative;

color:#5C4634;
}

/* الخلفية */
.bg{

position:absolute;

inset:0;

background:
linear-gradient(
rgba(248,244,236,.84),
rgba(248,244,236,.88)),
url("./assets/desert.png");

background-size:cover;

background-position:center;

z-index:0;
}

/* glow */
.bg::after{

content:"";

position:absolute;

width:500px;
height:500px;

background:
radial-gradient(
rgba(46,104,68,.12),
transparent 70%
);

top:-100px;
right:-100px;

filter:blur(40px);
}

body::after{

content:"";

position:absolute;

inset:0;

background-image:
radial-gradient(
rgba(120,90,60,.03) 1px,
transparent 1px);

background-size:18px 18px;

opacity:.35;

pointer-events:none;

z-index:0;
}

/* صنع بالسعودية */
.top-badge{

position:absolute;

top:20px;
right:20px;

background:
rgba(255,255,255,.55);

backdrop-filter:blur(16px);

border-radius:24px;

padding:12px 18px;

border:
1px solid rgba(255,255,255,.7);

box-shadow:
0 10px 30px rgba(0,0,0,.06);

z-index:10;
}

.top-badge div{

display:flex;
align-items:center;
gap:8px;

font-size:14px;
font-weight:700;

color:#5C4634;
}

.top-badge i{
color:#2E6844;
}

/* النخلة */
.left-palm{

position:absolute;

left:-40px;
bottom:-20px;

width:260px;

z-index:1;

opacity:.14;

mix-blend-mode:multiply;

pointer-events:none;
}

/* الصقر */
.falcon{

position:absolute;

right:-20px;
bottom:0;

width:300px;

opacity:.28;

z-index:1;

mix-blend-mode:multiply;

pointer-events:none;
}

/* الصفحة */
.page{

position:relative;

z-index:2;

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:20px;
}

/* اللوقو */
.logo-area{
text-align:center;
margin-bottom:20px;
}

.logo-image{

width:280px;

max-width:90%;

object-fit:contain;

margin-bottom:10px;
}

.logo-text{

font-size:22px;

line-height:1.8;

color:#7B5A3D;

font-weight:700;
}

.logo-text span{
color:#2E6844;
font-size:20px;
}

/* الكارد */
.card{

width:640px;
max-width:100%;

background:
rgba(255,255,255,.45);

backdrop-filter:blur(18px);

border-radius:36px;

padding:42px 30px;

text-align:center;

border:
1px solid rgba(255,255,255,.7);

box-shadow:
0 15px 45px rgba(90,70,50,.08);

transition:.3s;
}

.card:hover{

transform:
translateY(-2px);
}

/* النصوص */
.welcome{

font-size:48px;

color:#2E6844;

font-weight:800;

margin-bottom:12px;

text-shadow:
0 4px 12px rgba(46,104,68,.08);
}

.subtitle{

font-size:22px;

line-height:2;

color:#7B5A3D;

font-weight:600;

margin-bottom:35px;
}

/* المايك */
.mic-section{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-bottom:25px;
}

.mic-btn{

width:100px;
height:100px;

border:none;

border-radius:50%;

background:#2E6844;

color:white;

font-size:34px;

cursor:pointer;

transition:.3s;

position:relative;

animation:
pulse 2s infinite;
}

.mic-btn:hover{

transform:
scale(1.08);
}

.mic-btn::before{

content:"";

position:absolute;

inset:-12px;

border-radius:50%;

background:
rgba(46,104,68,.10);

z-index:-1;

animation:
glow 2s infinite;
}

@keyframes pulse{

0%{
box-shadow:
0 0 0 0 rgba(46,104,68,.35);
}

70%{
box-shadow:
0 0 0 22px rgba(46,104,68,0);
}

100%{
box-shadow:
0 0 0 0 rgba(46,104,68,0);
}

}

@keyframes glow{

0%,100%{
transform:scale(1);
opacity:.5;
}

50%{
transform:scale(1.12);
opacity:1;
}

}

/* الموجات */
.wave{

display:flex;

align-items:center;

gap:5px;
}

.wave span{

width:4px;

background:#7EA07A;

border-radius:30px;

animation:
voiceWave 1s infinite ease-in-out;
}

.wave span:nth-child(1){
height:10px;
}

.wave span:nth-child(2){
height:18px;
}

.wave span:nth-child(3){
height:30px;
}

.wave span:nth-child(4){
height:18px;
}

.wave span:nth-child(5){
height:10px;
}

@keyframes voiceWave{

0%,100%{
transform:scaleY(.5);
opacity:.5;
}

50%{
transform:scaleY(1.5);
opacity:1;
}

}

.action{

font-size:25px;

color:#2E6844;

font-weight:700;

margin-bottom:30px;
}

/* الميزات */
.features{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:14px;

margin-top:15px;
}

.feature{

background:
rgba(255,255,255,.72);

border-radius:18px;

padding:15px 14px;

border:
1px solid rgba(255,255,255,.7);

display:flex;

align-items:center;

justify-content:center;

gap:10px;

font-size:17px;

font-weight:700;

color:#5C4634;

transition:.3s;

cursor:pointer;

font-family:'Noto Naskh Arabic',serif;

outline:none;
}

.feature:hover{

transform:
translateY(-3px);

background:
rgba(255,255,255,.95);

box-shadow:
0 10px 20px rgba(0,0,0,.05);
}

.feature i{
color:#2E6844;
}

/* البوكس السفلي */
.bottom-box{

margin-top:20px;

width:640px;
max-width:100%;

background:
rgba(255,255,255,.45);

border-radius:26px;

padding:20px 24px;

display:flex;

justify-content:center;

align-items:center;

border:
1px solid rgba(255,255,255,.7);

backdrop-filter:blur(14px);

box-shadow:
0 10px 30px rgba(0,0,0,.05);
}

.bottom-text{

display:flex;

align-items:center;

gap:14px;
}

.bottom-text i{

width:52px;
height:52px;

display:flex;

align-items:center;

justify-content:center;

background:#F4EEE5;

border-radius:50%;

color:#8B6A4E;

font-size:20px;
}

.bottom-text h3{

font-size:22px;

color:#7B5A3D;
}

.bottom-text p{

font-size:15px;

color:#8B6A4E;
}

.footer{

margin-top:24px;

font-size:18px;

color:#7B5A3D;

font-weight:700;

opacity:.9;
}

#resultBox{

margin-top:22px;

background:
rgba(255,255,255,.75);

padding:18px;

border-radius:20px;

font-size:22px;

line-height:2;

color:#2E6844;

font-weight:700;

animation:
fadeIn .4s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:768px){

.logo-image{
width:220px;
}

.welcome{
font-size:34px;
}

.subtitle{
font-size:18px;
}

.card{
padding:30px 20px;
}

.mic-btn{
width:85px;
height:85px;
font-size:28px;
}

.falcon{
width:170px;
}

}

@media(max-width:480px){

.features{
grid-template-columns:1fr;
}

.feature{
font-size:15px;
}

.top-badge{
right:12px;
top:12px;
}

}

</style>

</head>

<body>

<div class="bg"></div>

<div class="top-badge">

<div>

<i class="fa-solid fa-palm-tree"></i>

صنع في السعودية

</div>

</div>

<img
src="./assets/palm.png"
class="left-palm">

<img
src="./assets/falcon.png"
class="falcon">

<div class="page">

<div class="logo-area">

<img
src="./assets/logo.png"
class="logo-image">

<div class="logo-text">

مساعدك الصوتي الذكي

<br>

<span>
يتحدث العربية بلمسة سعودية
</span>

</div>

</div>

<div class="card">

<div class="welcome">
هلا والله
</div>

<div class="subtitle">

تكلم وأنا أسمعك

<br>

صقر جاهز لمساعدتك

</div>

<div class="mic-section">

<div class="wave">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<button
class="mic-btn"
id="recordBtn">

<i class="fa-solid fa-microphone"></i>

</button>

<div class="wave">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

</div>

<div class="action">
اضغط وابدأ الحديث
</div>

<!-- الميزات -->
<div class="features">

<button class="feature">
<i class="fa-regular fa-lightbulb"></i>
معلومات عامة
</button>

<button class="feature">
<i class="fa-solid fa-globe"></i>
ترجمة
</button>

<button class="feature">
<i class="fa-regular fa-star"></i>
اقتراحات
</button>

<button class="feature">
<i class="fa-regular fa-circle-question"></i>
أسئلة وأجوبة
</button>

</div>

</div>

<div class="bottom-box">

<div class="bottom-text">

<i class="fa-solid fa-headphones"></i>

<div>

<h3>
صقر يستمع إليك الآن
</h3>

<p>
تحدث بوضوح للحصول على أفضل نتيجة
</p>

</div>

</div>

</div>

<div class="footer">

من أرض النخيل...
إلى عالم الذكاء

</div>

</div>

<script>

  /* =========================
  FEATURE BUTTONS
  ========================= */
  
  const features =
  document.querySelectorAll(".feature");
  
  features.forEach((btn) => {
  
  btn.addEventListener(
  "click",
  async () => {
  
  const text =
  btn.innerText.trim();
  
  let prompt = "";
  
  if(text.includes("معلومات")){
  
  prompt =
  "عطني معلومة عن السعودية";
  
  }
  
  else if(text.includes("ترجمة")){
  
  prompt =
  "ترجم لي هذي للإنجليزية";
  
  }
  
  else if(text.includes("اقتراحات")){
  
  prompt =
  "اقترح لي أماكن أزورها بالرياض";
  
  }
  
  else{
  
  prompt =
  "جاوبني على سؤال مفيد";
  
  }
  
  try{
  
  let oldBox =
  document.getElementById(
  "resultBox"
  );
  
  if(oldBox){
  oldBox.remove();
  }
  
  const loadingBox =
  document.createElement("div");
  
  loadingBox.id =
  "resultBox";
  
  loadingBox.innerHTML = `
  <div style="
  font-size:22px;
  color:#2E6844;
  font-weight:700;
  text-align:center;
  ">
  ⏳ صقر يفكر...
  </div>
  `;
  
  document
  .querySelector(".card")
  .appendChild(
  loadingBox
  );
  
  const response =
  await fetch(
  "https://saqr-voice-assistant-production.up.railway.app/chat",
  {
  method:"POST",
  
  headers:{
  "Content-Type":
  "application/json"
  },
  
  body:JSON.stringify({
  message:prompt
  })
  
  }
  );
  
  const data =
  await response.json();
  
  loadingBox.remove();
  
  const resultBox =
  document.createElement(
  "div"
  );
  
  resultBox.id =
  "resultBox";
  
  resultBox.innerHTML = `
  <div style="
  margin-bottom:14px;
  padding:12px;
  background:rgba(46,104,68,.08);
  border-radius:14px;
  ">
  🗣️ ${prompt}
  </div>
  
  <div style="
  padding:12px;
  background:white;
  border-radius:14px;
  ">
  🤖 ${data.reply}
  </div>
  `;
  
  document
  .querySelector(".card")
  .appendChild(
  resultBox
  );
  
  }catch(error){
  
  console.log(error);
  
  }
  
  });
  
  });
  
  /* =========================
  VOICE RECORDING
  ========================= */
  
  let mediaRecorder;
  
  let audioChunks = [];
  let isRecording = false;
  
  const recordBtn =
  document.getElementById(
  "recordBtn"
  );
  
  recordBtn.addEventListener(
  "click",
  async () => {
    if(isRecording){

mediaRecorder.stop();

recordBtn.innerHTML =
'<i class="fa-solid fa-microphone"></i>';

document.querySelector(
".action"
).innerHTML =
"جاري التحليل...";

recordBtn.style.background =
"#2E6844";

isRecording = false;

return;

}
  try {
  
  const stream =
  await navigator
  .mediaDevices
  .getUserMedia({
  audio:true
  });
  
  mediaRecorder =
  new MediaRecorder(stream);
  
  audioChunks = [];
  
  mediaRecorder.start();
  isRecording = true;
  
  recordBtn.innerHTML =
  '<i class="fa-solid fa-stop"></i>';
  
  document.querySelector(
  ".action"
  ).innerHTML =
  "صقر يستمع إليك الآن...";
  
  recordBtn.style.background =
  "#B34040";
  
  mediaRecorder.ondataavailable =
  (event) => {
  
  audioChunks.push(
  event.data
  );
  
  };
  
  mediaRecorder.onstop =
  async () => {
  
  const audioBlob =
  new Blob(
  audioChunks,
  {
  type:"audio/webm"
  }
  );
  
  const formData =
  new FormData();
  
  formData.append(
  "audio",
  audioBlob,
  "recording.webm"
  );
  
  try {
  
  let oldBox =
  document.getElementById(
  "resultBox"
  );
  
  if(oldBox){
  oldBox.remove();
  }
  
  const loadingBox =
  document.createElement("div");
  
  loadingBox.id =
  "resultBox";
  
  loadingBox.innerHTML = `
  <div style="
  font-size:22px;
  color:#2E6844;
  font-weight:700;
  text-align:center;
  ">
  🎙️ جاري التحليل...
  </div>
  `;
  
  document
  .querySelector(".card")
  .appendChild(
  loadingBox
  );
  
  const response =
  await fetch(
  "https://saqr-voice-assistant-production.up.railway.app/upload-audio",
  {
  method:"POST",
  body:formData
  }
  );
  
  const data =
  await response.json();
  
  loadingBox.remove();
  
  const resultBox =
  document.createElement(
  "div"
  );
  
  resultBox.id =
  "resultBox";
  
  resultBox.innerHTML = `
  <div style="
  margin-bottom:14px;
  padding:12px;
  background:rgba(46,104,68,.08);
  border-radius:14px;
  ">
  🗣️ ${data.transcript}
  </div>
  
  <div style="
  padding:12px;
  background:white;
  border-radius:14px;
  ">
  🤖 ${data.reply}
  </div>
  `;
  
  document
  .querySelector(".card")
  .appendChild(
  resultBox
  );
  
 if(data.audio_url){

const audio =
document.createElement("audio");

audio.controls = true;

audio.autoplay = true;

audio.style.width = "100%";

audio.style.marginTop = "15px";

audio.src =
data.audio_url +
"?t=" +
Date.now();

resultBox.appendChild(audio);

audio.play()
.then(() => {

console.log("VOICE PLAYING");

})
.catch((err) => {

console.log(err);

});

}
  
  }catch(error){
  
  console.log(error);
  
  }
  
  recordBtn.innerHTML =
  '<i class="fa-solid fa-microphone"></i>';
  
  document.querySelector(
  ".action"
  ).innerHTML =
  "اضغط وابدأ الحديث";
  
  recordBtn.style.background =
  "#2E6844";
  
  };
  
  
  
  }catch(error){
  
  console.log(error);
  
  alert(
  "اسمحي باستخدام المايك"
  );
  
  }
  
  });
  
  </script>

</body>

</html>
